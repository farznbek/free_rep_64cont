<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Telegram iOS Liquid Glass Bar</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 50% 80%, #150d2a 0%, #050508 100%);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      min-height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      overflow: hidden;
    }

    /* Pastki panel orqa foni */
    .tab-bar-container {
      position: relative;
      width: 94%;
      max-width: 420px;
      margin-bottom: 30px;
    }

    .tab-bar {
      position: relative;
      display: flex;
      background: rgba(18, 18, 24, 0.6);
      backdrop-filter: blur(45px) saturate(210%);
      -webkit-backdrop-filter: blur(45px) saturate(210%);
      border: 0.5px solid rgba(255, 255, 255, 0.08);
      padding: 6px;
      border-radius: 40px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), inset 0 0.5px 0.5px rgba(255, 255, 255, 0.12);
      touch-action: none;
    }

    /* Shaffof Suyuq Shisha Kapsula */
    .liquid-glass {
      position: absolute;
      top: 6px;
      left: 0;
      height: calc(100% - 12px);
      border-radius: 32px;
      pointer-events: none;
      z-index: 1;

      /* Toza shaffof oyna va kuchli xiralashtirish */
      background: rgba(255, 255, 255, 0.035);
      backdrop-filter: blur(35px) saturate(190%) brightness(1.2);
      -webkit-backdrop-filter: blur(35px) saturate(190%) brightness(1.2);

      /* Nozik oyna qirrasi va ichki yorug'lik aksi */
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-top: 1.2px solid rgba(255, 255, 255, 0.32);
      border-bottom: 0.8px solid rgba(255, 255, 255, 0.05);

      box-shadow: 
        0 12px 35px rgba(0, 0, 0, 0.4),
        inset 0 1.5px 2.5px rgba(255, 255, 255, 0.28),
        inset 0 -1.5px 2.5px rgba(0, 0, 0, 0.35);

      /* Mayin va silliq Apple inersiyasi */
      transition: transform 0.65s cubic-bezier(0.16, 1, 0.3, 1),
                  width 0.65s cubic-bezier(0.16, 1, 0.3, 1),
                  box-shadow 0.4s ease;
      will-change: transform, width;
      transform-origin: center center;
    }

    /* Bosib turgandagi kattalashish (Zoom) */
    .liquid-glass.pressed {
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 
        0 18px 45px rgba(0, 0, 0, 0.6),
        inset 0 2.5px 4px rgba(255, 255, 255, 0.4),
        inset 0 -2.5px 4px rgba(0, 0, 0, 0.45);
      /* Barmog'ingiz ostida darhol va silliq harakatlanadi */
      transition: width 0.2s cubic-bezier(0.16, 1, 0.3, 1),
                  box-shadow 0.3s ease;
    }

    /* Tab Tugmalari */
    .tab-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 7px 0;
      background: transparent;
      border: none;
      outline: none;
      cursor: pointer;
      z-index: 2;
      color: #787882;
      transition: color 0.4s ease;
    }

    .icon-box {
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .icon-box svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .tab-btn span {
      font-size: 10.5px;
      font-weight: 500;
      margin-top: 3px;
      letter-spacing: -0.1px;
      transition: transform 0.4s ease;
    }

    /* Faol Tab Holati */
    .tab-btn.active {
      color: #38bdf8;
    }

    .tab-btn.active .icon-box {
      transform: scale(1.14);
    }

    .tab-btn.active svg {
      stroke: #38bdf8;
    }
  </style>
</head>
<body>

  <div class="tab-bar-container">
    <div class="tab-bar" id="tabBar">
      <div class="liquid-glass" id="liquidGlass"></div>

      <button class="tab-btn active" data-index="0">
        <div class="icon-box">
          <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        </div>
        <span>Asosiy</span>
      </button>

      <button class="tab-btn" data-index="1">
        <div class="icon-box">
          <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        </div>
        <span>So'zlarim</span>
      </button>

      <button class="tab-btn" data-index="2">
        <div class="icon-box">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </div>
        <span>Qidirish</span>
      </button>

      <button class="tab-btn" data-index="3">
        <div class="icon-box">
          <svg viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon><line x1="8" y1="2" x2="8" y2="18"></line><line x1="16" y1="6" x2="16" y2="22"></line></svg>
        </div>
        <span>Yo'l xaritasi</span>
      </button>

      <button class="tab-btn" data-index="4">
        <div class="icon-box">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </div>
        <span>Profil</span>
      </button>
    </div>
  </div>

  <script>
    const tabBar = document.getElementById('tabBar');
    const glass = document.getElementById('liquidGlass');
    const tabs = Array.from(document.querySelectorAll('.tab-btn'));
    
    let activeIndex = 0;
    let isPressed = false;
    let lastTouchX = 0;

    function getTabLayout(index) {
      const tab = tabs[index];
      const tabRect = tab.getBoundingClientRect();
      const barRect = tabBar.getBoundingClientRect();
      return {
        left: tabRect.left - barRect.left,
        width: tabRect.width
      };
    }

    function setTab(index, animate = true) {
      activeIndex = Math.max(0, Math.min(index, tabs.length - 1));
      
      tabs.forEach((tab, i) => {
        tab.classList.toggle('active', i === activeIndex);
      });

      const { left, width } = getTabLayout(activeIndex);

      if (animate) {
        glass.classList.remove('pressed');
      }

      glass.style.width = `${width}px`;
      glass.style.transform = `translateX(${left}px) scale(1, 1)`;
    }

    // Bosganda kattalashish (Press Zoom)
    tabBar.addEventListener('pointerdown', (e) => {
      isPressed = true;
      lastTouchX = e.clientX;
      
      glass.classList.add('pressed');
      
      const barRect = tabBar.getBoundingClientRect();
      const clickRelativeX = e.clientX - barRect.left;
      const tabWidth = barRect.width / tabs.length;
      const targetIndex = Math.floor(clickRelativeX / tabWidth);
      
      setTab(targetIndex, false);
      
      // Bosib turganda shisha 18% ga kattalashadi
      const { left, width } = getTabLayout(activeIndex);
      glass.style.transform = `translateX(${left}px) scale(1.18, 1.14)`;
    });

    // Barmoq bilan surishda suyuq cho'zilish
    window.addEventListener('pointermove', (e) => {
      if (!isPressed) return;

      const barRect = tabBar.getBoundingClientRect();
      const currentX = Math.max(barRect.left, Math.min(e.clientX, barRect.right));
      const deltaX = currentX - lastTouchX;
      lastTouchX = currentX;

      const relativeX = currentX - barRect.left;
      const tabWidth = barRect.width / tabs.length;
      const hoverIndex = Math.floor(relativeX / tabWidth);

      if (hoverIndex >= 0 && hoverIndex < tabs.length && hoverIndex !== activeIndex) {
        activeIndex = hoverIndex;
        tabs.forEach((tab, i) => tab.classList.toggle('active', i === activeIndex));
      }

      // Surish tezligiga mos elastik cho'zilish
      const stretch = Math.min(Math.abs(deltaX) * 0.05, 0.3);
      const scaleX = 1.18 + stretch;
      const scaleY = 1.14 - (stretch * 0.35);

      const targetPos = relativeX - (tabWidth / 2);
      const safeLeft = Math.max(6, Math.min(targetPos, barRect.width - tabWidth - 6));

      glass.style.width = `${tabWidth}px`;
      glass.style.transform = `translateX(${safeLeft}px) scale(${scaleX}, ${scaleY})`;
    });

    // Barmoqni qo'yib yuborganda mayin o'z joyiga qaytish
    window.addEventListener('pointerup', () => {
      if (!isPressed) return;
      isPressed = false;
      setTab(activeIndex, true);
    });

    window.addEventListener('load', () => setTab(0, true));
  </script>
</body>
</html>
