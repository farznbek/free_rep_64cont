<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iOS Liquid Tab Bar</title>
  <style>
    body {
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      min-height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Tab Bar Asosi */
    .tab-bar {
      position: relative;
      display: flex;
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 6px;
      border-radius: 40px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      width: 92%;
      max-width: 420px;
    }

    /* Siljuvchi Elastik Fon (Indicator) */
    .indicator {
      position: absolute;
      top: 6px;
      left: 6px;
      height: calc(100% - 12px);
      background: rgba(255, 255, 255, 0.12);
      border-radius: 30px;
      pointer-events: none;
      /* iOS uslubidagi elastik o'tish */
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1),
                  width 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Tab Elementlari */
    .tab-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 4px;
      background: transparent;
      border: none;
      outline: none;
      cursor: pointer;
      z-index: 1;
      color: #94a3b8;
      transition: color 0.3s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .tab-item svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .tab-item span {
      font-size: 11px;
      font-weight: 500;
      margin-top: 4px;
      white-space: nowrap;
    }

    /* Faol Tab Holati */
    .tab-item.active {
      color: #38bdf8; /* Faol rang: Moviy / Binafsha qilib o'zgartirish mumkin */
    }

    .tab-item.active svg {
      transform: scale(1.18);
    }
  </style>
</head>
<body>

  <div class="tab-bar" id="tabBar">
    <div class="indicator" id="indicator"></div>

    <button class="tab-item active" data-index="0">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      <span>Asosiy</span>
    </button>

    <button class="tab-item" data-index="1">
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
      <span>So'zlarim</span>
    </button>

    <button class="tab-item" data-index="2">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <span>Qidirish</span>
    </button>

    <button class="tab-item" data-index="3">
      <svg viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon><line x1="8" y1="2" x2="8" y2="18"></line><line x1="16" y1="6" x2="16" y2="22"></line></svg>
      <span>Yo'l xaritasi</span>
    </button>

    <button class="tab-item" data-index="4">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      <span>Profil</span>
    </button>
  </div>

  <script>
    const tabs = document.querySelectorAll('.tab-item');
    const indicator = document.getElementById('indicator');
    const tabBar = document.getElementById('tabBar');

    function updateIndicator(target) {
      const targetRect = target.getBoundingClientRect();
      const barRect = tabBar.getBoundingClientRect();
      
      const leftOffset = targetRect.left - barRect.left - 6;
      const width = targetRect.width;

      indicator.style.width = `${width}px`;
      indicator.style.transform = `translateX(${leftOffset}px)`;
    }

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelector('.tab-item.active').classList.remove('active');
        tab.classList.add('active');
        updateIndicator(tab);
      });
    });

    // Boshlang'ich yuklanganda indikator joylashuvi
    window.addEventListener('load', () => {
      const activeTab = document.querySelector('.tab-item.active');
      updateIndicator(activeTab);
    });
  </script>
</body>
</html>
