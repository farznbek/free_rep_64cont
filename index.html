<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>iOS Liquid Glass Drag Bar</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: radial-gradient(circle at center, #1e1b4b 0%, #090d16 100%);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      min-height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* Pastki Panel Asosi (Kapsula) */
    .tab-bar {
      position: relative;
      display: flex;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px;
      border-radius: 40px;
      margin-bottom: 30px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.2);
      width: 92%;
      max-width: 420px;
      touch-action: none; /* iOS'da sahifa siljib ketmasligi uchun */
    }

    /* Suyuq Oyna (Liquid Glass Pill) */
    .indicator {
      position: absolute;
      top: 6px;
      left: 0;
      height: calc(100% - 12px);
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 30px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25), inset 0 1px 2px rgba(255, 255, 255, 0.6);
      pointer-events: none;
      transform: translateX(6px) scale(1);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                  width 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                  border-radius 0.3s ease;
    }

    /* Barmoq bilan ushlab turgandagi cho'zilish holati */
    .indicator.dragging {
      transition: none; /* Barmoq ostida kechikmasdan yurishi uchun */
      background: rgba(255, 255, 255, 0.22);
      transform-origin: center;
    }

    /* Tab Tugmalari */
    .tab-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 0;
      background: transparent;
      border: none;
      outline: none;
      cursor: pointer;
      z-index: 1;
      color: #94a3b8;
      transition: color 0.3s ease, transform 0.3s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .tab-item svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .tab-item span {
      font-size: 10px;
      font-weight: 500;
      margin-top: 4px;
      letter-spacing: 0.2px;
    }

    /* Faol Tugma Rangi va Sakrashi */
    .tab-item.active {
      color: #38bdf8;
    }

    .tab-item.active svg {
      transform: scale(1.15);
      stroke: #38bdf8;
    }
  </style>
</head>
<body>

  <div class="tab-bar" id="tabBar">
    <div class="indicator" id="indicator"></div>

    <button class="tab-item active" data-index="0">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      <span>Asosiy</span>
    </button>

    <button class="tab-item" data-index="1">
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
      <span>So'zlarim</span>
    </button>

    <button class="tab-item" data-index="2">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <span>Qidirish</span>
    </button>

    <button class="tab-item" data-index="3">
      <svg viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon><line x1="8" y1="2" x2="8" y2="18"></line><line x1="16" y1="6" x2="16" y2="22"></line></svg>
      <span>Yo'l xaritasi</span>
    </button>

    <button class="tab-item" data-index="4">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      <span>Profil</span>
    </button>
  </div>

  <script>
    const tabBar = document.getElementById('tabBar');
    const indicator = document.getElementById('indicator');
    const tabs = Array.from(document.querySelectorAll('.tab-item'));
    let activeIndex = 0;
    let isDragging = false;

    function setTab(index) {
      activeIndex = Math.max(0, Math.min(index, tabs.length - 1));
      tabs.forEach((tab, i) => {
        tab.classList.toggle('active', i === activeIndex);
      });
      const targetTab = tabs[activeIndex];
      const targetRect = targetTab.getBoundingClientRect();
      const barRect = tabBar.getBoundingClientRect();

      indicator.classList.remove('dragging');
      indicator.style.width = `${targetRect.width}px`;
      indicator.style.transform = `translateX(${targetRect.left - barRect.left}px) scale(1)`;
    }

    // Bosganda almashtirish
    tabs.forEach((tab, index) => {
      tab.addEventListener('pointerdown', () => setTab(index));
    });

    // Bosib turib surish (Drag / Swipe) mantig'i
    tabBar.addEventListener('pointerdown', (e) => {
      isDragging = true;
      indicator.classList.add('dragging');
      onPointerMove(e);
    });

    function onPointerMove(e) {
      if (!isDragging) return;
      const barRect = tabBar.getBoundingClientRect();
      const clientX = e.clientX;
      const relativeX = clientX - barRect.left;

      // Barmoq qaysi tugma ustida ekanligini topish
      const tabWidth = barRect.width / tabs.length;
      const currentIndex = Math.floor(relativeX / tabWidth);

      if (currentIndex >= 0 && currentIndex < tabs.length) {
        tabs.forEach((tab, i) => tab.classList.toggle('active', i === currentIndex));
      }

      // Suyuq cho'zilish (Liquid scale) effekti
      const currentIndicatorLeft = Math.max(6, Math.min(relativeX - (tabWidth / 2), barRect.width - tabWidth - 6));
      indicator.style.width = `${tabWidth * 1.15}px`; // Surilayotganda kengayadi
      indicator.style.transform = `translateX(${currentIndicatorLeft}px) scaleX(1.1)`;
    }

    window.addEventListener('pointermove', onPointerMove);

    window.addEventListener('pointerup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      const barRect = tabBar.getBoundingClientRect();
      const tabWidth = barRect.width / tabs.length;
      const finalIndex = Math.floor((e.clientX - barRect.left) / tabWidth);
      setTab(finalIndex);
    });

    window.addEventListener('load', () => setTab(0));
  </script>
</body>
</html>
