<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Telegram Real iOS Liquid Glass</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 50% 80%, #1e1035 0%, #08070d 100%);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      min-height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      overflow: hidden;
    }

    /* Pastki panel orqa foni */
    .tab-bar-container {
      position: relative;
      width: 94%;
      max-width: 420px;
      margin-bottom: 28px;
    }

    .tab-bar {
      position: relative;
      display: flex;
      background: rgba(20, 20, 26, 0.65);
      backdrop-filter: blur(40px) saturate(210%);
      -webkit-backdrop-filter: blur(40px) saturate(210%);
      border: 0.5px solid rgba(255, 255, 255, 0.08);
      padding: 5px;
      border-radius: 38px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), inset 0 0.5px 0.5px rgba(255, 255, 255, 0.15);
      touch-action: none;
    }

    /* Haqiqiy Shaffof Suyuq Oyna (Liquid Glass Capsule) */
    .liquid-glass {
      position: absolute;
      top: 5px;
      left: 0;
      height: calc(100% - 10px);
      border-radius: 30px;
      pointer-events: none;
      z-index: 1;

      /* Mutlaqo oq emas: faqat xiralashtiruvchi shaffof shisha */
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(30px) saturate(180%) brightness(1.15);
      -webkit-backdrop-filter: blur(30px) saturate(180%) brightness(1.15);

      /* Shisha qirralari va nozik nuri */
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-top: 1.2px solid rgba(255, 255, 255, 0.28);
      border-bottom: 0.8px solid rgba(255, 255, 255, 0.06);

      box-shadow: 
        0 10px 30px rgba(0, 0, 0, 0.35),
        inset 0 1.5px 2px rgba(255, 255, 255, 0.25),
        inset 0 -1.5px 2px rgba(0, 0, 0, 0.3);

      /* iOS Apple Spring tebranishi */
      transition: transform 0.48s cubic-bezier(0.2, 1, 0.22, 1),
                  width 0.48s cubic-bezier(0.2, 1, 0.22, 1),
                  box-shadow 0.25s ease;
      will-change: transform, width;
      transform-origin: center center;
    }

    /* Bosib turganda kattalashish va cho'zilish */
    .liquid-glass.pressed {
      background: rgba(255, 255, 255, 0.07);
      box-shadow: 
        0 14px 35px rgba(0, 0, 0, 0.5),
        inset 0 2px 3px rgba(255, 255, 255, 0.35),
        inset 0 -2px 3px rgba(0, 0, 0, 0.35);
      transition: none; /* Barmoq ostida darhol reaksiya berishi uchun */
    }

    /* Tab Tugmalari */
    .tab-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 7px 0;
      background: transparent;
      border: none;
      outline: none;
      cursor: pointer;
      z-index: 2;
      color: #7c7c84;
      transition: color 0.3s ease;
    }

    .icon-box {
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .icon-box svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .tab-btn span {
      font-size: 10.5px;
      font-weight: 500;
      margin-top: 3px;
      letter-spacing: -0.1px;
      transition: transform 0.3s ease;
    }

    /* Faol Tab rangi va kattalashishi */
    .tab-btn.active {
      color: #38bdf8; /* Telegram ko'k/moviy rangi */
    }

    .tab-btn.active .icon-box {
      transform: scale(1.1);
    }

    .tab-btn.active svg {
      stroke: #38bdf8;
    }
  </style>
</head>
<body>

  <div class="tab-bar-container">
    <div class="tab-bar" id="tabBar">
      <div class="liquid-glass" id="liquidGlass"></div>

      <button class="tab-btn active" data-index="0">
        <div class="icon-box">
          <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        </div>
        <span>Asosiy</span>
      </button>

      <button class="tab-btn" data-index="1">
        <div class="icon-box">
          <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        </div>
        <span>So'zlarim</span>
      </button>

      <button class="tab-btn" data-index="2">
        <div class="icon-box">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </div>
        <span>Qidirish</span>
      </button>

      <button class="tab-btn" data-index="3">
        <div class="icon-box">
          <svg viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon><line x1="8" y1="2" x2="8" y2="18"></line><line x1="16" y1="6" x2="16" y2="22"></line></svg>
        </div>
        <span>Yo'l xaritasi</span>
      </button>

      <button class="tab-btn" data-index="4">
        <div class="icon-box">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </div>
        <span>Profil</span>
      </button>
    </div>
  </div>

  <script>
    const tabBar = document.getElementById('tabBar');
    const glass = document.getElementById('liquidGlass');
    const tabs = Array.from(document.querySelectorAll('.tab-btn'));
    
    let activeIndex = 0;
    let isPressed = false;
    let startTouchX = 0;
    let lastTouchX = 0;

    function getTabLayout(index) {
      const tab = tabs[index];
      const tabRect = tab.getBoundingClientRect();
      const barRect = tabBar.getBoundingClientRect();
      return {
        left: tabRect.left - barRect.left,
        width: tabRect.width
      };
    }

    function setTab(index, animate = true) {
      activeIndex = Math.max(0, Math.min(index, tabs.length - 1));
      
      tabs.forEach((tab, i) => {
        tab.classList.toggle('active', i === activeIndex);
      });

      const { left, width } = getTabLayout(activeIndex);

      if (animate) {
        glass.classList.remove('pressed');
      }

      glass.style.width = `${width}px`;
      glass.style.transform = `translateX(${left}px) scale(1, 1)`;
    }

    // Tugma bosilganda
    tabBar.addEventListener('pointerdown', (e) => {
      isPressed = true;
      startTouchX = e.clientX;
      lastTouchX = e.clientX;
      
      glass.classList.add('pressed');
      
      const barRect = tabBar.getBoundingClientRect();
      const clickRelativeX = e.clientX - barRect.left;
      const tabWidth = barRect.width / tabs.length;
      const targetIndex = Math.floor(clickRelativeX / tabWidth);
      
      setTab(targetIndex, false);
      
      // Bosilganda shishani kattalashtirish (Zoom effekti)
      const { left, width } = getTabLayout(activeIndex);
      glass.style.transform = `translateX(${left}px) scale(1.06, 1.06)`;
    });

    // Barmoq bilan surish (Tabiiy suyuqlik cho'zilishi)
    window.addEventListener('pointermove', (e) => {
      if (!isPressed) return;

      const barRect = tabBar.getBoundingClientRect();
      const currentX = Math.max(barRect.left, Math.min(e.clientX, barRect.right));
      const deltaX = currentX - lastTouchX;
      lastTouchX = currentX;

      const relativeX = currentX - barRect.left;
      const tabWidth = barRect.width / tabs.length;
      const hoverIndex = Math.floor(relativeX / tabWidth);

      if (hoverIndex >= 0 && hoverIndex < tabs.length && hoverIndex !== activeIndex) {
        activeIndex = hoverIndex;
        tabs.forEach((tab, i) => tab.classList.toggle('active', i === activeIndex));
      }

      // Surish tezligiga qarab shishani oval qilib cho'zish
      const stretchFactor = Math.min(Math.abs(deltaX) * 0.08, 0.4);
      const scaleX = 1.08 + stretchFactor;
      const scaleY = 1.04 - (stretchFactor * 0.4);

      const targetPos = relativeX - (tabWidth / 2);
      const safeLeft = Math.max(5, Math.min(targetPos, barRect.width - tabWidth - 5));

      glass.style.width = `${tabWidth}px`;
      glass.style.transform = `translateX(${safeLeft}px) scale(${scaleX}, ${scaleY})`;
    });

    // Barmoqni qo'yib yuborganda mayin o'z holiga qaytish
    window.addEventListener('pointerup', () => {
      if (!isPressed) return;
      isPressed = false;
      setTab(activeIndex, true);
    });

    window.addEventListener('load', () => setTab(0, true));
  </script>
</body>
</html>
